version: 2
updates:
  # Titles follow Conventional Commits so the release workflow can classify them:
  # runtime deps -> "fix(deps): ..." (patch release), dev deps -> "chore(deps-dev): ..."
  # (no release), Actions -> "ci(deps): ..." (no release).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
