name: Release

# On every push to main:
#   plan    - classify commits since the current version (scripts/release.py plan)
#   publish - if the version in pyproject.toml has no tag yet (a release PR was just
#             merged), tag it and create the GitHub release with the CHANGELOG notes
#   prepare - if code changes are pending, open or update the release PR
#             (branch release/next) with the version bump and CHANGELOG
# Docs-, test-, CI- and agent-only changes never produce a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.plan.outputs.current }}
      publish: ${{ steps.plan.outputs.publish }}
      publish_sha: ${{ steps.plan.outputs.publish_sha }}
      bump: ${{ steps.plan.outputs.bump }}
      releasable: ${{ steps.plan.outputs.releasable }}
      next: ${{ steps.plan.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        run: |
          {
            echo '### Release plan'
            echo '```'
            python3 scripts/release.py plan
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.current }}
      SHA: ${{ needs.plan.outputs.publish_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.publish_sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Create tag and GitHub release
        run: |
          python3 scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/* \
            --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  prepare:
    needs: plan
    if: needs.plan.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      NEXT: ${{ needs.plan.outputs.next }}
      BUMP: ${{ needs.plan.outputs.bump }}
      # PRs opened with the default token don't trigger CI. Add a RELEASE_TOKEN
      # secret (fine-grained PAT or GitHub App token: contents + pull requests write)
      # to have CI run on the release PR; the checks below run either way.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Bump version and roll CHANGELOG
        run: |
          python3 scripts/release.py prepare "$NEXT"
          uv lock
      - name: Checks
        run: |
          uv sync --locked
          uv run black --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
      - name: Open or update the release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C release/next
          git commit -am "chore(release): v$NEXT"
          git push --force origin release/next
          {
            echo "Release **v$NEXT** ($BUMP bump), generated by the Release workflow."
            echo
            echo "Merging this PR tags \`v$NEXT\` and publishes the GitHub release."
            echo "This branch is regenerated on every push to main: edit the CHANGELOG"
            echo "through normal PRs, not here."
            echo
            echo '### Notes'
            echo
            python3 scripts/release.py notes "$NEXT"
          } > "$RUNNER_TEMP/body.md"
          title="chore(release): v$NEXT"
          if number=$(gh pr list --head release/next --state open --json number --jq '.[0].number') && [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head release/next --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
