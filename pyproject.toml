[project]
name = "garmin-mcp"
version = "0.2.0"
description = "Stateless, bring-your-own-key MCP server for Garmin Connect (Personal API, FastMCP)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sarath Chandra Bellam" }]
requires-python = ">=3.10"
keywords = ["mcp", "garmin", "fastmcp", "model-context-protocol", "fitness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp==4.1.8",
  "httpx>=0.28.1",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
]

[project.urls]
Homepage = "https://github.com/SarathChandraBellam/garmin-mcp"
Repository = "https://github.com/SarathChandraBellam/garmin-mcp"
Issues = "https://github.com/SarathChandraBellam/garmin-mcp/issues"
Changelog = "https://github.com/SarathChandraBellam/garmin-mcp/blob/main/CHANGELOG.md"
"Security policy" = "https://github.com/SarathChandraBellam/garmin-mcp/blob/main/SECURITY.md"

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"

[dependency-groups]
dev = [
  "black>=25.1",
  "ruff>=0.17.5",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-cov>=6",
  "respx>=0.23.1",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["garmin_mcp", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_server.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/garmin_mcp"]
mypy_path = "src"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore:authlib.jose module is deprecated",
]
markers = [
  "e2e: live tests against Garmin (opt-in; requires BASE and GARMIN_KEY_FILE)",
]
