/*@include:_head.html*/
<title>Wellness dashboard</title>
</head>
<body>
<main>
  <h1>Wellness dashboard</h1>
  <p class="sub" id="window">Waiting for data&hellip;</p>
  <div id="periods"></div>
  <section class="grid" id="tiles" aria-live="polite"></section>
  <p class="status" id="status" role="status"></p>
</main>
<script>
/*@include:_bridge.js*/
/*@include:_charts.js*/
const META = {
  sleep_hours: ["Sleep", true], resting_hr: ["Resting HR", false], hrv: ["Overnight HRV", true],
  stress: ["Stress", false], body_battery: ["Body Battery", true], steps: ["Steps", true],
};
const PERIODS = [["last_1d", "1 day"], ["last_7d", "7 days"], ["last_15d", "15 days"], ["last_30d", "30 days"], ["last_90d", "90 days"]];
let period = "last_7d";
const $ = (id) => document.getElementById(id);

function render(data) {
  if (!data || !data.metrics) return;
  if (data.window && PERIODS.some(([p]) => p === data.window.period)) period = data.window.period;
  $("window").textContent = `${data.window.start} – ${data.window.end} (${data.window.days} days, ${data.window.timezone}) vs the ${data.previous_window.days} days before`;
  $("periods").replaceChildren(segmented(PERIODS, period, load, "Time window"));
  const tiles = data.metrics.map((m) => {
    const [label, higherBetter] = META[m.metric] || [m.metric, true];
    const delta = m.change_pct;
    const good = delta === null || delta === undefined || delta === 0 ? "" : (delta > 0) === higherBetter ? "good" : "bad";
    const arrow = delta > 0 ? "↑" : delta < 0 ? "↓" : "";
    const values = (m.daily || []).map((d) => (d.partial ? null : d.value));
    return el("article", { class: "card", "aria-label": label },
      el("div", { class: "kpi-label", text: label }),
      el("div", { class: "kpi-value", text: fmt(m.average) }, el("span", { class: "kpi-unit", text: m.unit })),
      el("div", { class: "delta " + good, text: delta === null || delta === undefined ? "no previous data" : `${arrow} ${pctText(delta)} vs previous` }),
      el("div", { class: "muted", text: `min ${fmt(m.minimum)} · max ${fmt(m.maximum)}` }),
      values.length ? lineChart([{ values }], { label: `${label} per day`, height: 44 }) : null);
  });
  $("tiles").replaceChildren(...tiles);
}

async function load(p) {
  period = p;
  setStatus($("status"), "Loading…");
  try {
    render(await Bridge.callTool("dashboard_data", { period }));
    setStatus($("status"), "");
  } catch (e) {
    setStatus($("status"), "Could not load data: " + e.message, true);
  }
}

Bridge.init("garmin-dashboard", (data) => {
  render(data);
  const hasDaily = data && data.metrics && data.metrics.some((m) => m.daily);
  if (!hasDaily) load(period);
});
</script>
</body>
</html>
