/*@include:_head.html*/
<title>Activity explorer</title>
<style>
.split { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
:root[data-size="regular"] .split.open { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
:root[data-size="regular"] .split.open .col-secondary { display: none; }
:root[data-size="compact"] .split .drawer { order: -1; }
tr.row[aria-current="true"] .type-icon { background: var(--surface); }
.act { display: flex; align-items: center; gap: 10px; min-width: 0; }
.type-icon { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); }
.type-icon svg { width: 17px; height: 17px; }
.act-text { min-width: 0; display: grid; }
.act-name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-sub { font-size: var(--text-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.date { white-space: nowrap; }
td.date .act-sub { display: block; }
.list-foot { display: flex; justify-content: center; padding: 10px; border-top: 1px solid var(--border); }
.drawer { animation: slide-in var(--dur) var(--ease) both; position: relative; }
@keyframes slide-in { from { opacity: 0; transform: translateX(14px); } }
:root[data-size="compact"] .drawer { animation-name: rise; }
.drawer-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.drawer-head .act { flex: 1; align-items: flex-start; }
.drawer-head h2 { font-size: var(--text-lg); margin: 0; display: block; }
.drawer-head .type-icon { width: 38px; height: 38px; border-radius: 11px; }
.drawer-head .type-icon svg { width: 21px; height: 21px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
.drawer h3 { font-size: var(--text-sm); margin: 16px 0 8px; }
.drawer table { font-size: var(--text-xs); }
.drawer th, .drawer td { padding: 6px 8px; }
.sk-row td { padding: 12px; }
</style>
</head>
<body>
<main>
  <header class="app-head">
    <div class="titles"><span class="app-icon" data-icon="timer"></span>
      <div><h1>Activities</h1><p class="sub" id="window"><span class="sk title"></span></p></div></div>
    <div id="periods"></div>
  </header>
  <div id="error"></div>
  <div id="content">
    <section class="grid four" id="totals" aria-label="Totals"><div class="sk tile"></div><div class="sk tile"></div><div class="sk tile"></div><div class="sk tile"></div></section>
  </div>
  <section class="card" id="types-card" hidden><h2>Time by type <span class="note" id="types-note"></span></h2><div id="groups"></div></section>
  <div class="split" id="split">
    <section class="card flush" id="list-card" aria-label="Activities">
      <table>
        <caption class="sr-only">Activities, newest first. Press Enter on a row for details.</caption>
        <thead><tr><th>Date</th><th>Activity</th><th class="num">Distance</th><th class="num">Time</th><th class="num col-secondary">Avg HR</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="list-foot" id="more-wrap" hidden><button type="button" id="more">Load more</button></div>
    </section>
    <section class="card drawer" id="drawer" hidden aria-labelledby="drawer-title"></section>
  </div>
  <p class="sr-only" id="status" role="status"></p>
</main>
<script>
/*@include:_lib.js*/
const PERIODS = periodOptions(["last_7d", "last_30d", "last_90d", "this_month", "ytd"]);
let period = "last_30d", offset = 0, lastRow = null, seq = 0, summary = null;
const $ = (id) => document.getElementById(id);
const km = (v) => (has(v) && v > 0 ? fmt(v, v >= 100 ? 0 : 1) + " km" : "–");
function dur(min) {
  if (!has(min)) return "–";
  const t = Math.round(min);
  return t < 60 ? `${t} min` : `${Math.floor(t / 60)} h ${String(t % 60).padStart(2, "0")} m`;
}
function mmss(min) {
  if (!has(min) || !isFinite(min)) return "–";
  const s = Math.round(min * 60);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
const pace = (minPerKm) => (has(minPerKm) && isFinite(minPerKm) ? mmss(minPerKm) + " /km" : "–");
const isRun = (t) => /run|walk|hik/.test(t || "");
const typeBadge = (t) => el("span", { class: "type-icon", "aria-hidden": "true" }, icon(typeIcon(t)));

function tile(ic, label, value, unit, foot) {
  return el("article", { class: "card kpi enter" }, el("div", { class: "kpi-label" }, icon(ic), el("span", { text: label })),
    el("div", { class: "kpi-value" }, value, unit ? el("span", { class: "kpi-unit", text: unit }) : null),
    foot ? el("div", { class: "kpi-foot", text: foot }) : null);
}

function showEmpty(d) {
  $("totals").replaceChildren();
  $("types-card").hidden = true;
  $("split").hidden = true;
  $("content").replaceChildren(el("section", { class: "card" },
    emptyState("search", "No activities in this range",
      `Nothing was recorded ${d && d.window ? "between " + rangeText(d.window.start, d.window.end) : "in this window"}. Try a longer range.`,
      period !== "last_90d" ? ["Show the last 90 days", () => pick("last_90d")] : null)));
}

function renderSummary(d) {
  if (!d || !d.totals) return;
  summary = d;
  if (d.window && PERIODS.some(([p]) => p === d.window.period)) period = d.window.period;
  setWindow(windowText(d.window), `Time zone: ${d.window.timezone}`);
  $("periods").replaceChildren(segmented(PERIODS, period, pick, "Time window"));
  $("error").replaceChildren();
  const t = d.totals;
  if (!t.count) { showEmpty(d); return; }
  $("split").hidden = false;
  if (!$("totals")) $("content").replaceChildren(el("section", { class: "grid four", id: "totals", "aria-label": "Totals" }));
  const longest = t.duration_min ? `${fmt(t.duration_min / Math.max(1, t.count), 0)} min on average` : "";
  $("totals").replaceChildren(
    tile("pulse", "Activities", fmt(t.count, 0), "", `${fmt(t.count / Math.max(1, d.window.days / 7), 1)} per week`),
    tile("run", "Distance", fmt(t.distance_km, t.distance_km >= 100 ? 0 : 1), "km", ""),
    tile("timer", "Time", fmt(t.duration_min / 60, 1), "h", longest),
    tile("hike", "Climb", fmt(t.elevation_gain_m, 0), "m", ""));
  const groups = d.group_by === "type" ? d.groups : [];
  $("types-card").hidden = !groups.length;
  $("types-note").textContent = groups.length ? `${groups.length} type${groups.length > 1 ? "s" : ""}` : "";
  $("groups").replaceChildren(barList(groups.map((g) => ({ label: titleCase(g.key), value: g.duration_min,
    text: `${g.count}× · ${dur(g.duration_min)}` })), { label: "Time per activity type" }));
}

function row(a) {
  const open = (byKey) => { lastRow = tr; detail(a, byKey); };
  const when = a.start_local || "";
  const tr = el("tr", { class: "row", tabindex: "0", "data-id": a.activity_id, onclick: () => open(false),
    onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(true); } } },
    el("td", { class: "date" }, el("span", { text: shortDate(when.slice(0, 10)) }), el("span", { class: "act-sub", text: timeOf(when) })),
    el("td", {}, el("div", { class: "act" }, typeBadge(a.type),
      el("div", { class: "act-text" }, el("span", { class: "act-name", text: a.name || titleCase(a.type) || "Activity" }),
        el("span", { class: "act-sub", text: titleCase(a.type) })))),
    el("td", { class: "num", text: km(a.distance_km) }),
    el("td", { class: "num", text: dur(a.duration_min) }),
    el("td", { class: "num col-secondary", text: has(a.avg_hr) ? fmt(a.avg_hr, 0) + " bpm" : "–" }));
  return tr;
}
const skeletonRows = () => Array.from({ length: 5 }, () => el("tr", { class: "sk-row", "aria-hidden": "true" },
  el("td", { colspan: "5" }, el("span", { class: "sk line" }))));

async function page(reset, mine) {
  if (reset) { offset = 0; $("rows").replaceChildren(...skeletonRows()); $("more-wrap").hidden = true; }
  try {
    const p = await Bridge.callTool("activity_page", { period, offset });
    if (mine !== undefined && mine !== seq) return;
    if (reset) $("rows").replaceChildren();
    $("rows").append(...p.items.map(row));
    offset += p.items.length;
    $("more-wrap").hidden = !p.has_more;
    if (!offset && summary && summary.totals.count) $("rows").replaceChildren(el("tr", {}, el("td", { colspan: "5", class: "muted", text: "No activities in this window." })));
  } catch (e) {
    if (reset) $("rows").replaceChildren();
    $("error").replaceChildren(errorNotice("Could not load activities", e, () => refresh()));
  }
}

async function refresh() {
  const mine = ++seq;
  closeDrawer(false);
  setBusy([$("content"), $("types-card"), $("list-card")], true);
  announce("Loading activities…");
  try {
    const d = await Bridge.callTool("get_activity_summary", { period });
    if (mine !== seq) return;
    renderSummary(d);
    if (d.totals && d.totals.count) await page(true, mine);
    announce(`${d.totals ? d.totals.count : 0} activities, ${windowText(d.window)}`);
  } catch (e) {
    if (mine !== seq) return;
    if (!summary) { setWindow(""); $("content").replaceChildren(); $("split").hidden = true; }
    $("error").replaceChildren(errorNotice("Could not load your activities", e, () => refresh()));
  } finally {
    if (mine === seq) setBusy([$("content"), $("types-card"), $("list-card")], false);
  }
}
function pick(p) {
  period = p;
  $("periods").replaceChildren(segmented(PERIODS, period, pick, "Time window"));
  refresh();
}

function closeDrawer(restoreFocus) {
  if ($("drawer").hidden) return;
  $("drawer").hidden = true;
  $("split").classList.remove("open");
  for (const r of $("rows").querySelectorAll("tr[aria-current]")) r.removeAttribute("aria-current");
  if (restoreFocus !== false && lastRow) lastRow.focus();
}

/* Splits: time per lap, plus pace (runs, when laps are not 1 km) or speed (everything else). */
function splitTable(splits, run) {
  const perKm = run && splits.every((s) => has(s.distance_km) && Math.abs(s.distance_km - 1) < 0.05);
  const extra = perKm ? null : run ? "Pace" : "Speed";
  const cols = ["#", "Distance", perKm ? "Pace" : "Time", extra, "HR"].filter(Boolean);
  const rowOf = (s) => el("tr", {}, el("td", { text: s.index }), el("td", { class: "num", text: fmt(s.distance_km, 2) + " km" }),
    el("td", { class: "num", text: perKm ? mmss(s.duration_min) + " /km" : mmss(s.duration_min) }),
    extra ? el("td", { class: "num", text: run ? pace(s.distance_km ? s.duration_min / s.distance_km : null) : fmt(s.avg_speed_kmh, 1) + " km/h" }) : null,
    el("td", { class: "num", text: fmt(s.avg_hr, 0) }));
  const LIMIT = 8;
  const body = el("tbody", {}, ...splits.slice(0, LIMIT).map(rowOf));
  const table = el("table", {}, el("thead", {}, el("tr", {}, ...cols.map((h, i) => el("th", { class: i ? "num" : "", text: h })))), body);
  if (splits.length <= LIMIT) return table;
  const more = el("button", { type: "button", class: "ghost", text: `Show all ${splits.length} splits`, onclick: () => {
    body.append(...splits.slice(LIMIT).map(rowOf));
    more.remove();
  } });
  return el("div", {}, table, el("div", { class: "list-foot" }, more));
}

function stat(label, value) { return el("div", { class: "stat" }, el("b", { text: value }), el("span", { text: label })); }

async function detail(a, byKey) {
  const drawer = $("drawer");
  for (const r of $("rows").querySelectorAll("tr[aria-current]")) r.removeAttribute("aria-current");
  if (lastRow) lastRow.setAttribute("aria-current", "true");
  const title = el("h2", { id: "drawer-title", tabindex: "-1", text: a.name || titleCase(a.type) || "Activity" });
  const close = el("button", { type: "button", class: "ghost icon-btn", "aria-label": "Close details", title: "Close (Esc)", onclick: () => closeDrawer() }, icon("close"));
  const head = el("div", { class: "drawer-head" }, el("div", { class: "act" }, typeBadge(a.type),
    el("div", { class: "act-text" }, title, el("span", { class: "act-sub", text: `${dayDate((a.start_local || "").slice(0, 10))} · ${timeOf(a.start_local)} · ${titleCase(a.type)}` }))), close);
  drawer.hidden = false;
  drawer.style.animation = "none"; void drawer.offsetWidth; drawer.style.animation = "";
  $("split").classList.add("open");
  drawer.replaceChildren(head, el("div", { class: "stats" }, ...Array.from({ length: 6 }, () => el("div", { class: "sk", style: "height:48px" }))));
  title.focus({ preventScroll: true });
  if (Bridge.compact()) drawer.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  try {
    const d = await Bridge.callTool("activity_detail", { activity_id: a.activity_id });
    if (drawer.hidden || !lastRow || String(lastRow.dataset.id) !== String(a.activity_id)) return;
    const x = d.activity, run = isRun(x.type);
    const speed = run ? pace(x.distance_km ? x.duration_min / x.distance_km : null) : has(x.avg_speed_kmh) ? fmt(x.avg_speed_kmh, 1) + " km/h" : "–";
    const splits = d.splits.length ? splitTable(d.splits, run) : el("p", { class: "muted", text: (d.notes && d.notes[0]) || "No splits recorded." });
    const zoneTotal = d.hr_zone_min.reduce((s, v) => s + (v || 0), 0);
    drawer.replaceChildren(head,
      el("div", { class: "stats enter" }, stat("Distance", km(x.distance_km)), stat("Time", dur(x.duration_min)), stat(run ? "Avg pace" : "Avg speed", speed),
        stat("Avg HR", has(x.avg_hr) ? fmt(x.avg_hr, 0) + " bpm" : "–"), stat("Calories", has(x.calories) ? fmt(x.calories, 0) + " kcal" : "–"),
        stat("Climb", has(x.elevation_gain_m) ? fmt(x.elevation_gain_m, 0) + " m" : "–")),
      el("h3", { text: "Heart-rate zones" }),
      zoneTotal ? barList(d.hr_zone_min.map((v, i) => ({ label: "Zone " + (i + 1), value: v, cls: "z" + (i + 1), text: fmt(v, 0) + " min" })), { label: "Minutes in each heart-rate zone" })
        : el("p", { class: "muted", text: "No heart-rate zone data." }),
      el("h3", { text: "Splits" }), splits);
    if (byKey && document.activeElement === document.body) title.focus({ preventScroll: true });
  } catch (e) {
    drawer.replaceChildren(head, errorNotice("Could not load this activity", e, () => detail(a, byKey)));
  }
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });
$("more").addEventListener("click", () => page(false));
mountChrome();
Bridge.init("garmin-activities", (d) => {
  if (d && d.window && PERIODS.some(([p]) => p === d.window.period)) period = d.window.period;
  if (d && d.totals) {
    const mine = ++seq;
    renderSummary(d);
    if (d.totals.count) page(true, mine);
  } else refresh();
});
</script>
</body>
</html>
