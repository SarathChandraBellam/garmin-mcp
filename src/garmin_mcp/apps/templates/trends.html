/*@include:_head.html*/
<title>Trend compare</title>
</head>
<body>
<main>
  <h1>Trend compare</h1>
  <p class="sub" id="window">Waiting for data&hellip;</p>
  <label for="metric">Metric</label>
  <select id="metric"></select>
  <div id="periods" style="margin-top:8px"></div>
  <section class="grid" id="tiles"></section>
  <div class="card" style="margin-top:10px">
    <div id="chart"></div>
    <div class="legend"><span><i style="background:var(--s0)"></i><span id="la">A</span></span><span><i style="background:var(--s1)"></i><span id="lb">B</span></span></div>
  </div>
  <p class="status" id="status" role="status"></p>
</main>
<script>
/*@include:_bridge.js*/
/*@include:_charts.js*/
const $ = (id) => document.getElementById(id);
const METRICS = [["steps", "Steps"], ["resting_hr", "Resting HR"], ["hrv", "Overnight HRV"], ["stress", "Stress"], ["body_battery", "Body Battery"], ["sleep_hours", "Sleep hours"], ["sleep_score", "Sleep score"], ["intensity_minutes", "Intensity minutes"], ["calories", "Calories"], ["weight_kg", "Weight"], ["vo2max", "VO2 max"]];
const PERIODS = [["last_7d", "7 days"], ["last_15d", "15 days"], ["last_30d", "30 days"], ["last_90d", "90 days"], ["this_month", "This month"]];
let metric = "steps", periodA = "last_30d", periodB = null;

function tile(label, s, unit) {
  return el("article", { class: "card" }, el("div", { class: "kpi-label", text: label }),
    el("div", { class: "kpi-value", text: fmt(s.average) }, el("span", { class: "kpi-unit", text: unit })),
    el("div", { class: "muted", text: `${s.days_with_data} days · trend ${s.trend || "–"}` }));
}

function render(d) {
  $("window").textContent = `A ${d.window_a.start} – ${d.window_a.end} vs B ${d.window_b.start} – ${d.window_b.end}`;
  $("la").textContent = `A ${d.window_a.start} – ${d.window_a.end}`;
  $("lb").textContent = `B ${d.window_b.start} – ${d.window_b.end}`;
  $("tiles").replaceChildren(tile("A", d.a, d.unit), tile("B", d.b, d.unit),
    el("article", { class: "card" }, el("div", { class: "kpi-label", text: "Change A − B" }),
      el("div", { class: "kpi-value", text: d.change === null || d.change === undefined ? "–" : (d.change > 0 ? "+" : "") + fmt(d.change) }, el("span", { class: "kpi-unit", text: d.unit })),
      el("div", { class: "muted", text: pctText(d.change_pct) })));
  const a = d.a_daily.map((x) => (x.partial ? null : x.value)), b = d.b_daily.map((x) => x.value);
  $("chart").replaceChildren(lineChart([{ values: a }, { values: b }], { label: `${d.metric}: A solid, B dashed, aligned by day`, height: 120, width: 600 }));
}

async function load() {
  $("periods").replaceChildren(segmented(PERIODS, periodA, (p) => { periodA = p; periodB = null; load(); }, "Window A"));
  setStatus($("status"), "Loading…");
  try {
    const args = { metric, period_a: periodA };
    if (periodB) args.period_b = periodB;
    render(await Bridge.callTool("trend_data", args));
    setStatus($("status"), "");
  } catch (e) { setStatus($("status"), "Could not load data: " + e.message, true); }
}

$("metric").replaceChildren(...METRICS.map(([v, t]) => el("option", { value: v, text: t })));
$("metric").addEventListener("change", (e) => { metric = e.target.value; load(); });
const named = (w) => (w && PERIODS.concat([["last_week"], ["last_month"], ["this_week"], ["ytd"]]).some(([p]) => p === w.period) ? w.period : null);
Bridge.init("garmin-trends", (d) => {
  if (d && d.metric) metric = d.metric;
  else if (d && d.metrics && d.metrics[0]) metric = d.metrics[0].metric;
  const wa = d && (d.window_a || d.window);
  periodA = named(wa) || periodA;
  periodB = d && d.window_b ? named(d.window_b) : null;
  $("metric").value = metric;
  load();
});
</script>
</body>
</html>
