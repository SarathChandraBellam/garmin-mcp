/*@include:_head.html*/
<title>Trend compare</title>
<style>
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.controls .ctl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.win-label { display: flex; align-items: center; gap: 8px; }
#tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
:root[data-size="compact"] #tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
:root[data-size="compact"] #tiles > :last-child { grid-column: 1 / -1; }
#tiles .kpi-foot.stacked { flex-direction: column; align-items: flex-start; gap: 1px; }
.chart-foot { font-size: var(--text-xs); color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header class="app-head">
    <div class="titles"><span class="app-icon" data-icon="trend"></span>
      <div><h1>Trends</h1><p class="sub" id="window"><span class="sk title"></span></p></div></div>
    <label class="field">Metric <select id="metric"></select></label>
  </header>
  <div class="controls">
    <div class="ctl"><span class="seg-label" id="la-label">Compare</span><div id="periods-a"></div></div>
    <div class="ctl"><span class="seg-label" id="lb-label">with</span><div id="periods-b"></div></div>
  </div>
  <div id="error"></div>
  <section class="grid" id="tiles" aria-label="Summary"><div class="sk tile"></div><div class="sk tile"></div><div class="sk tile"></div></section>
  <section class="card" id="chart-card">
    <h2><span id="chart-title">Daily values</span> <span class="note" id="chart-note"></span></h2>
    <div id="chart"><div class="sk" style="height:180px"></div></div>
    <ul class="legend" id="legend"></ul>
    <p class="chart-foot" id="chart-foot"></p>
  </section>
  <p class="sr-only" id="status" role="status"></p>
</main>
<script>
/*@include:_lib.js*/
const $ = (id) => document.getElementById(id);
const METRICS = [["steps", "Steps", true, 0], ["resting_hr", "Resting HR", false, 0], ["hrv", "Overnight HRV", true, 0], ["stress", "Stress", false, 0],
  ["body_battery", "Body Battery", true, 0], ["sleep_hours", "Sleep hours", true, 1], ["sleep_score", "Sleep score", true, 0],
  ["intensity_minutes", "Intensity minutes", true, 0], ["calories", "Calories", null, 0], ["weight_kg", "Weight", null, 1], ["vo2max", "VO2 max", true, 1]];
const META = Object.fromEntries(METRICS.map(([k, l, hb, d]) => [k, { label: l, higherBetter: hb, digits: d }]));
const PERIODS_A = periodOptions(["last_7d", "last_30d", "last_90d", "this_month"]);
const PERIODS_B = periodOptions(["previous", "last_week", "last_month"]);
let metric = "steps", periodA = "last_30d", periodB = null, seq = 0, shown = false;

function winName(w, fallback) {
  return w && PERIOD_LABELS[w.period] ? periodName(w.period) : fallback;
}
function sideTile(cls, title, w, s, unit, digits) {
  const trend = { up: "↑ Trending up", down: "↓ Trending down", flat: "→ Steady" }[s.trend] || "";
  return el("article", { class: "card kpi enter" },
    el("div", { class: "kpi-label" }, el("i", { class: "key-line" + cls, "aria-hidden": "true" }), el("span", { text: title })),
    el("div", { class: "kpi-value" }, fmt(s.average, digits), unitText(unit) ? el("span", { class: "kpi-unit", text: unitText(unit) }) : null),
    el("div", { class: "kpi-foot stacked" }, el("span", { text: `${rangeText(w.start, w.end)} · ${s.days_with_data} of ${w.days} days` }),
      trend ? el("span", { class: "nowrap", text: trend }) : null));
}

function render(d) {
  shown = true;
  const m = META[d.metric] || { label: d.metric, higherBetter: true, digits: 1 };
  const nameA = winName(d.window_a, "Window A");
  const nameB = periodB ? winName(d.window_b, "Window B") : "Before";
  setWindow(`${m.label} · ${rangeText(d.window_a.start, d.window_a.end)} vs ${rangeText(d.window_b.start, d.window_b.end)}`, `Time zone: ${d.window_a.timezone}`);
  $("error").replaceChildren();
  const ch = d.change;
  const changeVal = has(ch) ? (ch > 0 ? "+" : ch < 0 ? "−" : "") + fmt(Math.abs(ch), m.digits) : "–";
  $("tiles").replaceChildren(
    sideTile("", nameA, d.window_a, d.a, d.unit, m.digits),
    sideTile(" dashed", nameB === "Before" ? "The days before" : nameB, d.window_b, d.b, d.unit, m.digits),
    el("article", { class: "card kpi enter" }, el("div", { class: "kpi-label" }, icon("trend"), el("span", { text: "Change" }),
      d.unit === "0-100" ? el("span", { class: "kpi-scale", text: "· 0–100 scale" }) : null),
      el("div", { class: "kpi-value" }, changeVal, unitText(d.unit) && has(ch) ? el("span", { class: "kpi-unit", text: unitText(d.unit) }) : null),
      el("div", { class: "kpi-foot" }, deltaChip(d.change_pct, m.higherBetter), el("span", { text: `${nameA.toLowerCase()} vs ${(nameB === "Before" ? "the days before" : nameB.toLowerCase())}` }))));
  const cut = (xs) => xs.map((x) => (x.partial && d.metric === "steps" ? null : x.value));
  const a = cut(d.a_daily), b = cut(d.b_daily);
  const n = Math.max(a.length, b.length);
  const xl = n > 1 ? [[0, "Day 1", "start"], [n - 1, `Day ${n}`, "end"]] : [];
  if (n >= 9) xl.push([Math.floor((n - 1) / 2), `Day ${Math.floor((n - 1) / 2) + 1}`]);
  $("chart-title").textContent = m.label + " per day";
  $("chart-note").textContent = unitText(d.unit) || (d.unit === "0-100" ? "0–100" : "");
  $("chart").replaceChildren(chartSlot((w) => lineChart([{ values: a, area: true }, { values: b, cls: "s1", lastDot: false }],
    { label: `${m.label}: ${nameA} solid, ${nameB} dashed, aligned by day of window`, width: w, height: 190, axes: true, length: n, xLabels: xl }), 190));
  $("legend").replaceChildren(
    el("li", {}, el("i", { class: "key-line", "aria-hidden": "true" }), `${nameA} · ${rangeText(d.window_a.start, d.window_a.end)}`),
    el("li", {}, el("i", { class: "key-line dashed", "aria-hidden": "true" }), `${nameB === "Before" ? "The days before" : nameB} · ${rangeText(d.window_b.start, d.window_b.end)}`));
  $("chart-foot").textContent = a.length !== b.length
    ? `Lined up by day of each window (day 1 = ${shortDate(d.window_a.start)} and ${shortDate(d.window_b.start)}). The windows have ${a.length} and ${b.length} days, so the shorter line ends early.`
    : `Lined up by day of each window: day 1 = ${shortDate(d.window_a.start)} and ${shortDate(d.window_b.start)}.`;
  requestAnimationFrame(() => paintCharts());
}

function controls() {
  $("periods-a").replaceChildren(segmented(PERIODS_A, periodA, (p) => { periodA = p; load(); }, "Compare this window"));
  $("periods-b").replaceChildren(segmented(PERIODS_B, periodB || "previous", (p) => { periodB = p === "previous" ? null : p; load(); }, "With this window"));
}

async function load() {
  const mine = ++seq;
  controls();
  setBusy([$("tiles"), $("chart-card")], true);
  announce("Loading…");
  try {
    const args = { metric, period_a: periodA };
    if (periodB) args.period_b = periodB;
    const d = await Bridge.callTool("trend_data", args);
    if (mine !== seq) return;
    render(d);
    announce(`Showing ${META[d.metric] ? META[d.metric].label : d.metric}`);
  } catch (e) {
    if (mine !== seq) return;
    if (!shown) { setWindow(""); $("tiles").replaceChildren(); $("chart").replaceChildren(); }
    $("error").replaceChildren(errorNotice("Could not load this comparison", e, () => load()));
  } finally {
    if (mine === seq) setBusy([$("tiles"), $("chart-card")], false);
  }
}

$("metric").replaceChildren(...METRICS.map(([v, t]) => el("option", { value: v, text: t })));
$("metric").addEventListener("change", (e) => { metric = e.target.value; load(); });
const known = (w, list) => (w && list.some(([p]) => p === w.period) ? w.period : null);
mountChrome();
Bridge.init("garmin-trends", (d) => {
  if (d && d.metric && META[d.metric]) metric = d.metric;
  else if (d && d.metrics && d.metrics[0] && META[d.metrics[0].metric]) metric = d.metrics[0].metric;
  const wa = d && (d.window_a || d.window);
  periodA = known(wa, PERIODS_A) || periodA;
  periodB = d && d.window_b ? known(d.window_b, PERIODS_B) : null;
  $("metric").value = metric;
  load();
});
</script>
</body>
</html>
